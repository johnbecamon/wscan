name: Build WSCAN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            openjdk-17-jdk \
            autoconf automake libtool libtool-bin libltdl-dev \
            pkg-config m4 \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake \
            libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade buildozer cython Pillow

      - name: Generate icons if missing
        run: |
          if [ ! -f icon.png ]; then
            python make_icon.py
          fi

      - name: Build APK with Buildozer
        run: |
          export CCACHE_DIR=/home/runner/.ccache
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wscan-apk
          path: bin/*.apk
          retention-days: 30
